name: Deploy to Azure

# Build + publish + deploy only - no tests (they live in tests.yml and are run manually).
# Single App Service hosts both the API and the React build (served from wwwroot), so the
# browser sees one origin and the SameSite=Strict refresh cookie keeps working.
# DB migrations run automatically at app startup (DatabaseMigrationService).
#
# One-time setup:
#   1. Azure Portal -> App Service -> Overview -> "Download publish profile".
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions:
#        secret   AZURE_WEBAPP_PUBLISH_PROFILE = full contents of the .PublishSettings file
#        variable AZURE_WEBAPP_NAME            = the App Service name

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-land/package-lock.json

      - name: Build frontend
        working-directory: front-land
        run: |
          npm ci
          npm run build

      - name: Copy frontend into API wwwroot
        run: |
          mkdir -p LandlordApp/wwwroot
          cp -r front-land/dist/. LandlordApp/wwwroot/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: dotnet publish LandlordApp/Lander.csproj -c Release -o publish

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
