name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LandlordApp.Tests/LandlordApp.Tests.csproj

      - name: Build
        run: dotnet build LandlordApp.Tests/LandlordApp.Tests.csproj --no-restore -warnaserror:CS0105

      - name: Test
        run: dotnet test LandlordApp.Tests/LandlordApp.Tests.csproj --no-build --verbosity minimal

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-land
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-land/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build
