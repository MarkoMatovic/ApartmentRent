name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    # Hard ceiling: a hung test host would otherwise hold the runner for GitHub's 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LandlordApp.Tests/LandlordApp.Tests.csproj

      - name: Build
        run: dotnet build LandlordApp.Tests/LandlordApp.Tests.csproj --no-restore -warnaserror:CS0105

      - name: Test
        # --blame-hang kills and dumps a test host that stops making progress instead of waiting forever.
        run: dotnet test LandlordApp.Tests/LandlordApp.Tests.csproj --no-build --verbosity minimal --blame-hang --blame-hang-timeout 10m

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front-land
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-land/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (errors fail the build)
        run: npm run lint:ci

      - name: Test
        run: npm test

      - name: Typecheck & build
        run: npm run build
